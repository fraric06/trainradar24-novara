<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainRadar24 — Piemonte + Lombardia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/app.css?v=20260825-railfix1">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row"><div><div class="logo">TRAIN<span>RADAR</span>24</div><div class="subtitle">PIEMONTE + LOMBARDIA · TRENI IN TEMPO REALE</div></div><div class="clock" id="clock">--:--:--</div></div>
      <span class="live" id="liveBadge">● AVVIO</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="count" class="g">0</b>treni visibili</div>
      <div class="stat"><b id="ontime" class="g">0</b>0–4 min</div>
      <div class="stat"><b id="yellow" class="y">0</b>5–30 min</div>
      <div class="stat"><b id="red" class="r">0</b>&gt;30 min</div>
    </div>
    <div class="toptools">
      <div class="select-row">
        <select id="regionFilter" class="select"><option value="ALL">AREA · Piemonte + Lombardia</option><option value="piemonte">Piemonte</option><option value="lombardia">Lombardia</option></select>
        <select id="typeFilter" class="select"><option value="ALL">TIPO TRENO · Tutti</option><option value="RV">RV · Regionali Veloci</option><option value="REG">REG · Regionali</option><option value="SFM">SFM · Torino</option><option value="SUB">SUB · Suburbani</option><option value="MXP">MXP · Malpensa Express</option></select>
      </div>
      <button id="location" class="location">📍 La mia posizione</button>
      <div id="locationHint" class="hint">Attiva la geolocalizzazione per vedere i treni vicino a te.</div>
    </div>
    <div class="chips">
      <button class="chip active" data-cat="ALL">TUTTI <span class="n">0</span></button>
      <button class="chip" data-cat="REG">REG <span class="n">0</span></button>
      <button class="chip" data-cat="RV">RV <span class="n">0</span></button>
      <button class="chip" data-cat="SFM">SFM <span class="n">0</span></button>
      <button class="chip" data-cat="SUB">SUB <span class="n">0</span></button>
      <button class="chip" data-cat="MXP">MXP <span class="n">0</span></button>
    </div>
    <div class="list-head"><span>TRENI ATTIVI · <span id="visibleCount">0</span></span><span id="updated">--:--:--</span></div>
    <div class="list" id="list"><div class="empty">Caricamento rete ferroviaria regionale…</div></div>
  </aside>
  <main class="mapwrap">
    <div id="map" class="map"></div>
    <div class="map-toolbar">
      <button class="map-btn" id="searchBtn">⌕ RICERCA TRENO</button>
    </div>
    <div class="search-panel" id="searchPanel"><input id="searchInput" placeholder="Numero treno, linea, stazione…"><div class="search-results" id="searchResults"></div></div>
    <div class="legend"><span><i style="background:#39ff8e"></i>0–4 min</span><span><i style="background:#ffb020"></i>5–30 min</span><span><i style="background:#ff4d4d"></i>&gt;30 min</span><span><i style="background:#91a0ad"></i>realtime n/d</span><span><i style="background:#ffbd2e"></i>RV</span></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js?v=20260825-railfix1"></script>
</body>
</html>
